services:
  api:
    build:
      context: .
      target: node
    image: librechat-local
    container_name: LibreChat-API
    depends_on:
      - mongodb
      - meilisearch
      - rag_api
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - DEBUG_LOGGING=false
      - DEBUG_CONSOLE=false
      - TRUST_PROXY=1
      - PROXY_TRUSTED_IPS=172.16.0.0/12,10.0.0.0/8
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./mcp-servers:/app/mcp-servers
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librechat-http.rule=Host(`chat.intra-ai.de`)"
      - "traefik.http.routers.librechat-http.entrypoints=web"
      - "traefik.http.routers.librechat-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.librechat.rule=Host(`chat.intra-ai.de`)"
      - "traefik.http.routers.librechat.entrypoints=websecure"
      - "traefik.http.routers.librechat.tls.certresolver=le"
      - "traefik.http.routers.librechat.middlewares=hsts-headers@file,gzip@file,ratelimit@file,privacy-headers@file"
      - "traefik.http.services.librechat.loadbalancer.server.port=3080"
      - "traefik.docker.network=web"
  mongodb:
    container_name: chat-mongodb
    image: mongo:7
    restart: unless-stopped
    volumes:
      - /mnt/mongo_secure/data/db:/data/db
    command: mongod --auth
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - internal

  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.12:/meili_data
    networks:
      - internal

  vectordb:
    container_name: chat-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - internal

  rag_api:
    container_name: chat-rag-api
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
    networks:
      - internal

  # SearXNG: Private, DSGVO-konforme Suchmaschine für Web Search
  searxng:
    container_name: librechat-searxng
    image: searxng/searxng:latest
    restart: always
    ports:
      - "8090:8080"  # External: 8090, Internal: 8080 (Zammad nutzt bereits 8080)
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8090/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    networks:
      - internal

  # Reranker: Jina AI Reranker v2 mit Hugging Face TEI (CPU-optimiert)
  reranker:
    container_name: librechat-reranker
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: always
    ports:
      - "8001:80"  # External: 8001, Internal: 80 (TEI default)
    environment:
      - HUGGING_FACE_HUB_URL=https://huggingface.co
    command: --model-id jinaai/jina-reranker-v2-base-multilingual --port 80
    volumes:
      - ./data/reranker:/data  # Model cache
    networks:
      - internal
    shm_size: 1g

networks:
  internal:
    driver: bridge
  web:
    external: true

volumes:
  pgdata2:
